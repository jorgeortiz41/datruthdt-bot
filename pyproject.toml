[project]
name = "creatorbot"
version = "0.1.0"
description = "A Discord bot that answers questions in a YouTuber's voice, grounded in their videos and a domain knowledge base."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
    "openai>=1.50",
    "discord.py>=2.3",
    "yt-dlp>=2024.1.1",
    "youtube-transcript-api>=1.0",
    "httpx>=0.27",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Dense (semantic) retrieval on top of the built-in lexical search.
dense = ["numpy>=1.24"]
dev = ["pytest>=8.0"]

[project.scripts]
creatorbot = "creatorbot.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
